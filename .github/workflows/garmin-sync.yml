name: Garmin Training Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"
      timezone: "Europe/Warsaw"

permissions:
  contents: read

concurrency:
  group: garmin-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: |
          dotnet restore Hermes.csproj
          dotnet restore tests/Hermes.Tests/Hermes.Tests.csproj
      - name: Test
        run: dotnet test tests/Hermes.Tests/Hermes.Tests.csproj --no-restore --configuration Release
      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      - name: Run Garmin Sync
        env:
          GARMIN_API_KEY: ${{ secrets.GARMIN_API_KEY }}
        run: dotnet run --project Hermes.csproj --configuration Release
